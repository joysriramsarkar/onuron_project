name: Release & Distribution

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --all

      - name: Validate Registry
        run: pnpm validate

      - name: Build All Monorepo Sites
        run: pnpm build

      - name: Package Distributions
        run: |
          mkdir -p release-bundles
          tar -czf release-bundles/onuron-main.tar.gz -C apps/main/dist .
          tar -czf release-bundles/onuron-os.tar.gz -C apps/os/dist .
          tar -czf release-bundles/onuron-alap.tar.gz -C apps/alap/dist .
          tar -czf release-bundles/onuron-nil.tar.gz -C apps/nil/dist .
          tar -czf release-bundles/onuron-store.tar.gz -C apps/store/dist .
          tar -czf release-bundles/onuron-docs.tar.gz -C apps/docs/dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-bundles/*
          generate_release_notes: true
          draft: false
          prerelease: false
