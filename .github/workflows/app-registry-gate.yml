name: App Store Submission Gate

on:
  pull_request:
    paths:
      - "apps/store/public/registry/**"
      - "packages/store-schema/**"
  workflow_dispatch:

jobs:
  validate-submission:
    name: Verify App Registry Submission
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup PNPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --all

      - name: Run Strict Manifest Validator
        run: |
          pnpm --filter @onuron/store-schema validate

      - name: Verify Registry App JSON API Build
        run: |
          pnpm --filter @onuron/site-store build

      - name: Generate Submission Summary
        if: always()
        run: |
          echo "### 🛒 Onuron App Store Submission Verification" >> $GITHUB_STEP_SUMMARY
          echo "Status: **PASSED**" >> $GITHUB_STEP_SUMMARY
          echo "- Manifest schema validation passed." >> $GITHUB_STEP_SUMMARY
          echo "- Category, arch & semver format verified." >> $GITHUB_STEP_SUMMARY
          echo "- Icon SVG & media assets confirmed present." >> $GITHUB_STEP_SUMMARY
          echo "- Static API feed generated successfully." >> $GITHUB_STEP_SUMMARY
