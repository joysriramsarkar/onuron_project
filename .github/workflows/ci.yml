name: CI Pipeline

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-registry:
    name: Validate App Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Setup Node 24
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --all
      - name: Run Registry Validator
        run: pnpm validate
      - name: Verify package signatures (validate:verify)
        run: pnpm --filter @onuron/store-schema validate:verify
      - name: Check contract mirror (contracts:check)
        run: pnpm --filter @onuron/store-schema contracts:check

  build-all:
    name: Build All Ecosystem Apps
    needs: validate-registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Setup Node 24
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --all
      - name: Turborepo Build
        run: pnpm build
